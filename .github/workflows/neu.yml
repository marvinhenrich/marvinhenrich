# Täglich die neuesten Seiten von net-evolution.de in die Profil-README übernehmen.
name: Neu auf net-evolution.de
on:
  schedule:
    - cron: "15 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/neu.mjs
      - name: Nur bei Änderung einchecken
        run: |
          if git diff --quiet; then echo "Nichts zu tun."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Neu auf net-evolution.de aktualisiert"
          git push
