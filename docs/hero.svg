<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">Marvin Henrich</title>
  <desc id="d">Fachinformatiker für Systemintegration und selbstständig mit Net-Evolution. Drei Projekte laufen im Betrieb: OpenSignage, EnterpriseAI, x-Height.</desc>

  <style>
    /* ------------------------------------------------------------------
       GRUNDSATZ: Der Ruhezustand ist der FERTIGE Zustand.
       Bewegung ist Zugabe, nie Voraussetzung. Laeuft sie nicht — weil
       jemand Bewegung abbestellt hat, weil ein Bildschirmfoto entsteht oder
       weil ein Betrachter sie nicht ausfuehrt — steht trotzdem alles fertig
       da. Vorher war es umgekehrt: dann fehlte die Linie unter dem Namen
       und die Fusszeile war leer, der Kopf sah kaputt aus.

       Ausserdem CSS statt SMIL: nur so laesst sich Bewegung ueber
       prefers-reduced-motion wirklich abschalten. CSS kann eine laufende
       SMIL-Animation nicht ueberschreiben.
       ------------------------------------------------------------------ */
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .paper { fill: #FAF9F5; }
    .card  { fill: #FFFFFF; }
    .line  { stroke: #E6E2D8; }
    .ink   { fill: #17181B; }
    .body  { fill: #474C55; }
    .muted { fill: #6A6F79; }
    .teal  { fill: #0F6E56; }
    .tealstroke { stroke: #0F6E56; }

    @media (prefers-color-scheme: dark) {
      .paper { fill: #141513; }
      .card  { fill: #1C1E1B; }
      .line  { stroke: #2E312C; }
      .ink   { fill: #F0EFE9; }
      .body  { fill: #C2C1B8; }
      .muted { fill: #8B8A80; }
      .teal  { fill: #45C47C; }
      .tealstroke { stroke: #45C47C; }
    }

    /* Linie unter dem Namen: fertig gezeichnet, die Animation zieht sie nur nach. */
    @keyframes zeichnen { from { stroke-dashoffset: 330; } to { stroke-dashoffset: 0; } }
    .rule {
      stroke-dasharray: 330; stroke-dashoffset: 0;
      animation: zeichnen 1.1s cubic-bezier(.2,0,0,1) .15s forwards;
    }



    /* Kacheln: ruhig getoent, die Animation hebt sie nacheinander hervor. */
    @keyframes aufleuchten {
       0%,  4%  { opacity: .07; }
      10%, 26%  { opacity: .16; }
      32%, 100% { opacity: .07; }
    }
    .tile-lit { opacity: .07; animation: aufleuchten 4.8s ease-in-out infinite; }
    .t2 { animation-delay: .45s; }
    .t3 { animation-delay: .90s; }

    /* Rein schmueckend: ohne Bewegung schlicht nicht da, das fehlt niemandem. */
    @keyframes wandern {
       0%       { opacity: 0;  transform: translateY(0); }
       6%       { opacity: .9; }
      26%       { opacity: .9; transform: translateY(96px); }
      32%, 100% { opacity: 0;  transform: translateY(96px); }
    }
    .beam { opacity: 0; animation: wandern 4.8s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .rule, .tile-lit, .beam { animation: none; }
    }
  </style>

  <rect width="1200" height="260" class="paper"/>
  <rect x="0" y="0" width="1200" height="3" class="teal"/>

  <text x="72" y="112" class="sans ink" font-size="48" font-weight="600" letter-spacing="-1.2">Marvin Henrich</text>
  <line class="rule tealstroke" x1="74" y1="130" x2="404" y2="130" stroke-width="3" stroke-linecap="round"/>

  <text x="72" y="166" class="sans body" font-size="19">Fachinformatiker für Systemintegration · selbstständig mit Net-Evolution</text>
  <text x="72" y="196" class="sans muted" font-size="16">Ich baue Dinge, die im Betrieb laufen müssen — nicht nur in der Demo.</text>

  <text x="74" y="230" class="mono muted" font-size="13">selbst gehostet · nachvollziehbar · läuft im Betrieb</text>

  <g transform="translate(830,60)">
    <text x="0" y="0" class="mono muted" font-size="11" letter-spacing="1">IM BETRIEB</text>

    <g transform="translate(0,18)">
      <rect x="0" y="0" width="290" height="38" rx="10" class="card"/>
      <rect x="0" y="0" width="290" height="38" rx="10" fill="none" class="line" stroke-width="1.5"/>
      <rect class="tile-lit teal" x="0" y="0" width="290" height="38" rx="10"/>
      <circle cx="20" cy="19" r="4" class="teal"/>
      <text x="38" y="24" class="sans ink" font-size="15" font-weight="500">OpenSignage</text>
      <text x="278" y="24" text-anchor="end" class="mono muted" font-size="11">Signage</text>
    </g>

    <g transform="translate(0,66)">
      <rect x="0" y="0" width="290" height="38" rx="10" class="card"/>
      <rect x="0" y="0" width="290" height="38" rx="10" fill="none" class="line" stroke-width="1.5"/>
      <rect class="tile-lit t2 teal" x="0" y="0" width="290" height="38" rx="10"/>
      <circle cx="20" cy="19" r="4" class="teal"/>
      <text x="38" y="24" class="sans ink" font-size="15" font-weight="500">EnterpriseAI</text>
      <text x="278" y="24" text-anchor="end" class="mono muted" font-size="11">KI, lokal</text>
    </g>

    <g transform="translate(0,114)">
      <rect x="0" y="0" width="290" height="38" rx="10" class="card"/>
      <rect x="0" y="0" width="290" height="38" rx="10" fill="none" class="line" stroke-width="1.5"/>
      <rect class="tile-lit t3 teal" x="0" y="0" width="290" height="38" rx="10"/>
      <circle cx="20" cy="19" r="4" class="teal"/>
      <text x="38" y="24" class="sans ink" font-size="15" font-weight="500">x-Height</text>
      <text x="278" y="24" text-anchor="end" class="mono muted" font-size="11">Typografie</text>
    </g>

    <circle class="beam teal" cx="-14" cy="37" r="3.5"/>
  </g>
</svg>
