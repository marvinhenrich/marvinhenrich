<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-labelledby="t d">
  <title id="t">Marvin Henrich</title>
  <desc id="d">Fachinformatiker für Systemintegration und selbstständig mit Net-Evolution. Drei Projekte laufen im Betrieb.</desc>

  <style>
    .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    .paper { fill: #FAF9F5; }
    .card  { fill: #FFFFFF; }
    .line  { stroke: #E6E2D8; }
    .ink   { fill: #17181B; }
    .body  { fill: #474C55; }
    .muted { fill: #6A6F79; }
    .teal  { fill: #0F6E56; }
    .tealstroke { stroke: #0F6E56; }

    @media (prefers-color-scheme: dark) {
      .paper { fill: #141513; }
      .card  { fill: #1C1E1B; }
      .line  { stroke: #2E312C; }
      .ink   { fill: #F0EFE9; }
      .body  { fill: #C2C1B8; }
      .muted { fill: #8B8A80; }
      .teal  { fill: #45C47C; }
      .tealstroke { stroke: #45C47C; }
    }

    /* Zwei Bewegungen, beide erklaerend: die Linie unter dem Namen zeichnet sich,
       die drei Kacheln leuchten nacheinander auf - je eine je Projekt.
       Wer Bewegung abbestellt hat, sieht den fertigen Zustand. */
    @media (prefers-reduced-motion: reduce) {
      .draw { stroke-dashoffset: 0; }
      .tile-lit { opacity: .22; }
      .beam { display: none; }
      /* Ohne Bewegung bliebe die wechselnde Zeile sonst ganz leer:
         die erste Phrase stehen lassen, den Cursor ausblenden. */
      .phrase        { opacity: 0; }
      .phrase:first-of-type { opacity: 1; }
      .caret         { display: none; }
    }
  </style>

  <rect width="1200" height="260" class="paper"/>
  <rect x="0" y="0" width="1200" height="3" class="teal"/>

  <!-- Name -->
  <text x="72" y="112" class="sans ink" font-size="48" font-weight="600" letter-spacing="-1.2">Marvin Henrich</text>

  <!-- Linie, die sich zeichnet -->
  <line class="draw tealstroke" x1="74" y1="130" x2="404" y2="130" stroke-width="3" stroke-linecap="round"
        stroke-dasharray="330" stroke-dashoffset="330">
    <animate attributeName="stroke-dashoffset" from="330" to="0" dur="1.1s" begin="0.2s"
             fill="freeze" calcMode="spline" keySplines="0.2 0 0 1"/>
  </line>

  <text x="72" y="166" class="sans body" font-size="19">Fachinformatiker für Systemintegration · selbstständig mit Net-Evolution</text>
  <text x="72" y="196" class="sans muted" font-size="16">Ich baue Dinge, die im Betrieb laufen müssen — nicht nur in der Demo.</text>

  <g class="phrase" opacity="0">
    <text x="74" y="230" class="mono muted" font-size="13">selbst gehostet<tspan class="caret teal" dx="4">█<animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete"/></tspan></text>
    <animate attributeName="opacity" dur="12.0s" repeatCount="indefinite"
             values="0;1;1;0;0" keyTimes="0;0.020;0.210;0.230;1"/>
  </g>
  <g class="phrase" opacity="0">
    <text x="74" y="230" class="mono muted" font-size="13">nachvollziehbar<tspan class="caret teal" dx="4">█<animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete"/></tspan></text>
    <animate attributeName="opacity" dur="12.0s" repeatCount="indefinite"
             values="0;1;1;0;0" keyTimes="0;0.270;0.460;0.480;1"/>
  </g>
  <g class="phrase" opacity="0">
    <text x="74" y="230" class="mono muted" font-size="13">ohne fremden Dienst<tspan class="caret teal" dx="4">█<animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete"/></tspan></text>
    <animate attributeName="opacity" dur="12.0s" repeatCount="indefinite"
             values="0;1;1;0;0" keyTimes="0;0.520;0.710;0.730;1"/>
  </g>
  <g class="phrase" opacity="0">
    <text x="74" y="230" class="mono muted" font-size="13">läuft im Betrieb<tspan class="caret teal" dx="4">█<animate attributeName="opacity" dur="1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1" calcMode="discrete"/></tspan></text>
    <animate attributeName="opacity" dur="12.0s" repeatCount="indefinite"
             values="0;1;1;0;0" keyTimes="0;0.770;0.960;0.980;1"/>
  </g>

  <!-- Drei Projekte als Kacheln, die nacheinander angehen -->
  <g transform="translate(830,60)">
    <text x="0" y="0" class="mono muted" font-size="11" letter-spacing="1">IM BETRIEB</text>

    <g transform="translate(0,18)">
      <rect x="0" y="0" width="290" height="38" rx="10" class="card"/>
      <rect x="0" y="0" width="290" height="38" rx="10" fill="none" class="line" stroke-width="1.5"/>
      <rect class="tile-lit teal" x="0" y="0" width="290" height="38" rx="10" opacity="0">
        <animate attributeName="opacity" dur="4.2s" begin="1.2s" repeatCount="indefinite"
                 values="0;.14;.14;0;0" keyTimes="0;0.08;0.28;0.36;1"/>
      </rect>
      <circle cx="20" cy="19" r="4" class="teal"/>
      <text x="38" y="24" class="sans ink" font-size="15" font-weight="500">OpenSignage</text>
      <text x="278" y="24" text-anchor="end" class="mono muted" font-size="11">Signage</text>
    </g>

    <g transform="translate(0,66)">
      <rect x="0" y="0" width="290" height="38" rx="10" class="card"/>
      <rect x="0" y="0" width="290" height="38" rx="10" fill="none" class="line" stroke-width="1.5"/>
      <rect class="tile-lit teal" x="0" y="0" width="290" height="38" rx="10" opacity="0">
        <animate attributeName="opacity" dur="4.2s" begin="1.6s" repeatCount="indefinite"
                 values="0;.14;.14;0;0" keyTimes="0;0.08;0.28;0.36;1"/>
      </rect>
      <circle cx="20" cy="19" r="4" class="teal"/>
      <text x="38" y="24" class="sans ink" font-size="15" font-weight="500">EnterpriseAI</text>
      <text x="278" y="24" text-anchor="end" class="mono muted" font-size="11">KI, lokal</text>
    </g>

    <g transform="translate(0,114)">
      <rect x="0" y="0" width="290" height="38" rx="10" class="card"/>
      <rect x="0" y="0" width="290" height="38" rx="10" fill="none" class="line" stroke-width="1.5"/>
      <rect class="tile-lit teal" x="0" y="0" width="290" height="38" rx="10" opacity="0">
        <animate attributeName="opacity" dur="4.2s" begin="2s" repeatCount="indefinite"
                 values="0;.14;.14;0;0" keyTimes="0;0.08;0.28;0.36;1"/>
      </rect>
      <circle cx="20" cy="19" r="4" class="teal"/>
      <text x="38" y="24" class="sans ink" font-size="15" font-weight="500">x-Height</text>
      <text x="278" y="24" text-anchor="end" class="mono muted" font-size="11">Typografie</text>
    </g>

    <!-- Impuls, der die drei der Reihe nach anstoesst -->
    <g class="beam">
      <circle r="3.5" class="teal" opacity="0">
        <animateMotion dur="4.2s" begin="1s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.4 0 0.2 1;0.4 0 0.2 1;0 0 1 1"
          keyTimes="0;0.14;0.28;1"
          path="M -14 37 L -14 85 L -14 133 L -14 133"/>
        <animate attributeName="opacity" dur="4.2s" begin="1s" repeatCount="indefinite"
          values="0;.9;.9;0;0" keyTimes="0;0.04;0.28;0.36;1"/>
      </circle>
    </g>
  </g>
</svg>
